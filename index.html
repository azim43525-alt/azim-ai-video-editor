<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AZIM AI Video Editor</templates>
<style>
*{box-sizing:border-box}body{margin:0;background:#10131b;color:#f4f5f7;font:16px system-ui,sans-serif}
main{max-width:680px;margin:24px auto;padding:18px}.panel{background:#1b2130;border:1px solid #30394c;border-radius:16px;padding:20px}
h1{font-size:25px;margin:0 0 8px}.muted{color:#b5bfd0;font-size:14px;line-height:1.5}
label{display:block;margin:18px 0 7px;font-weight:650}textarea,input{width:100%;padding:13px;border-radius:10px;border:1px solid #46516a;background:#101622;color:white;font:inherit}
textarea{min-height:150px;resize:vertical}input[type=file]{padding:10px}
button,a.btn{display:block;width:100%;margin-top:20px;padding:14px;border:0;border-radius:10px;background:#7c9cff;color:#10131b;font-weight:800;text-align:center;text-decoration:none;font-size:16px}
#status{white-space:pre-wrap;margin-top:16px;color:#d7e0f2}.small{font-size:12px;color:#9eabc0;margin-top:12px}
</style></head>
<body><main><div class="panel">
<h1>AZIM AI VIDEO EDITOR</h1>
<p class="muted">স্ক্রিপ্ট, ভয়েস এবং একটি ভিডিও ক্লিপ দিন। ভয়েস থেকে টাইমিংসহ ক্যাপশন তৈরি হবে এবং 9:16 MP4 export হবে।</p>
<form id="form">
<label>ভিডিওর স্ক্রিপ্ট</label><textarea name="script" required placeholder="এখানে সম্পূর্ণ স্ক্রিপ্ট লিখুন..."></textarea>
<label>ভয়েস ফাইল (MP3/WAV/M4A)</label><input type="file" name="voice" accept="audio/*" required>
<label>ভিডিও ফুটেজ (MP4/MOV)</label><input type="file" name="footage" accept="video/*" required>
<button id="go">ভিডিও তৈরি করুন</button>
</form><div id="status"></div><div class="small">প্রথমবার প্রসেসিং ধীর হতে পারে। বড় ফাইল আপলোডে সার্ভারের সীমা প্রযোজ্য। ব্যক্তিগত/অনুমতিহীন কনটেন্ট আপলোড করবেন না।</div>
</div></main>
<script>
const form=document.getElementById('form'), status=document.getElementById('status'), go=document.getElementById('go');
form.addEventListener('submit',async e=>{
 e.preventDefault(); go.disabled=true; go.textContent='তৈরি হচ্ছে...'; status.textContent='আপলোড ও ক্যাপশন প্রসেসিং চলছে। প্রথমবার Whisper মডেল নামতে সময় লাগতে পারে।';
 try{
  const r=await fetch('/create',{method:'POST',body:new FormData(form)});
  const data=await r.json(); if(!r.ok) throw new Error(data.detail||'কিছু সমস্যা হয়েছে');
  status.textContent='ভিডিও তৈরি হয়েছে।\n\nClaude-এর edit notes:\n'+(data.editor_notes||'')+'\n\n';
  const a=document.createElement('a'); a.href=data.download; a.className='btn'; a.textContent='MP4 ডাউনলোড'; status.appendChild(a);
 }catch(err){status.textContent='Error: '+err.message}
 finally{go.disabled=false;go.textContent='ভিডিও তৈরি করুন'}
});
</script></body></html>
